<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">ZonAcha</title>
  <desc id="desc">Logo ZonAcha avec lettres bleu marine et orange, et un sac de courses stylisé en guise de A.</desc>
  <g stroke-linejoin="round" stroke-linecap="round">
    <!-- Zon -->
    <text x="155" y="405" font-family="Arial, DejaVu Sans, sans-serif" font-size="270" font-weight="800" letter-spacing="-12" fill="#07377C">Zon</text>
    <!-- Shopping bag handle -->
    <path d="M635 253 C635 176 658 143 679 143 C702 143 723 176 723 253" fill="none" stroke="#FF6500" stroke-width="11"/>
    <!-- Bag body -->
    <path d="M614 243 Q606 243 605 255 L588 395 Q586 414 605 414 L735 414 Q754 414 751 394 L736 255 Q735 243 724 243 Z" fill="#FF6500"/>
    <!-- Handle attachment eyelets -->
    <circle cx="636" cy="257" r="15" fill="#07377C" stroke="#F5F5F5" stroke-width="6"/>
    <circle cx="720" cy="257" r="15" fill="#07377C" stroke="#F5F5F5" stroke-width="6"/>
    <!-- White A cutout/stroke on bag -->
    <path d="M625 398 L677 280 Q680 273 686 280 L736 398 L711 398 L680 326 L650 398 Z" fill="#FFFFFF"/>
    <!-- cha -->
    <text x="780" y="405" font-family="Arial, DejaVu Sans, sans-serif" font-size="270" font-weight="800" letter-spacing="-8" fill="#FF6500">cha</text>
  </g>
</svg>
