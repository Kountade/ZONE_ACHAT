<!doctype html>
<html lang="fr" data-theme="emerald">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />

    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#1e40af" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="StockAcha" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="StockAcha" />

    <!-- ✅ Favicon principal — StockAcha -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Favicons PNG (fallback / navigateurs anciens) -->
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/icons/icon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/icons/icon-16x16.png"
    />

    <!-- Apple Touch Icons -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link
      rel="apple-touch-icon"
      sizes="152x152"
      href="/icons/icon-152x152.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="120x120"
      href="/icons/icon-120x120.png"
    />
    <link rel="apple-touch-icon" sizes="76x76" href="/icons/icon-76x76.png" />

    <!-- Manifest -->
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- SEO -->
    <meta
      name="description"
      content="StockAcha — Votre stock, notre logistique, votre tranquillité. Plateforme de stockage, de gestion de stock et de logistique pour commerçants, vendeurs en ligne, entrepreneurs et entreprises."
    />
    <meta property="og:title" content="StockAcha" />
    <meta
      property="og:description"
      content="StockAcha — Votre stock, notre logistique, votre tranquillité."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/og-image.png" />

    <title>StockAcha — Votre stock, notre logistique, votre tranquillité</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
